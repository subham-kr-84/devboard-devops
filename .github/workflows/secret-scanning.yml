#goals- i have to ensure that no secrets are accidentally committed to the repository.
name: Secrets Scanning

on:
  workflow_call:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}