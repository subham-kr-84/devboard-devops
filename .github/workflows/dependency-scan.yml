#goals- i have to ensure that packages and dependencies are up-to-date and secure.
name: Dependency Scan
on:
  workflow_call:

jobs: 
  dependency-scan:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: run dependency scan for node.js
        run: npm audit
        working-directory: frontend

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          go-version-file: 'backend/go.mod'
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
        working-directory: backend

      - name: run govulncheck
        continue-on-error: true
        working-directory: backend
        run: |
         mkdir -p reports
         govulncheck ./... > reports/govulncheck-report.txt

      - name: upload report to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: backend/reports/govulncheck-report.txt
          retention-days: 7


