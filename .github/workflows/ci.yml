# Goals- To lint, build, test the code for frontend and backend and push its image to Dockerhub.

name: CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies/packages
        run: npm install
        working-directory: frontend

      - name: run linter
        run: npm run lint
        working-directory: frontend

      - name: run test
        run: npm run test
        working-directory: frontend

