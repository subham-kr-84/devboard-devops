# Goals- To lint, build, test the code for frontend and backend and push its image to Dockerhub.

name: CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies/packages
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: run linter
        run: npm run lint
        working-directory: frontend

      - name: run test
        run: npm run test
        working-directory: frontend

      - name: docker setup(login)
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          go-version-file: 'backend/go.mod'
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies/packages
        run: go mod download
        working-directory: backend

      - name: run formatter
        run: go fmt ./...
        working-directory: backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend

      - name: run tests
        run: go test ./...
        working-directory: backend

      - name: docker setup(login)
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
  
