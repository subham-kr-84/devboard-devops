# Goals- To lint, build, test the code for frontend and backend and push its image to Dockerhub.

name: CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies/packages
        run: npm ci

      - name: run linter
        run: npm run lint

      - name: run test
        run: npm run test	

