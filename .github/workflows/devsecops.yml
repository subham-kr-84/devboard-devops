# goals- to run end to end devsecops pipeline
#--------CI-----------------------------------------------
name: DevSecOps

on:
  push:
    branches: [main]

jobs:
# Jobs for the DevSecOps pipeline 
# Jobs for the DevSecOps pipeline include code quality, secret scanning, and dependency scanning.
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  docker-scan:
    uses: ./.github/workflows/docker-scan.yml
    secrets: inherit

  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit  

  code-test:
    uses: ./.github/workflows/code-test.yml

  docker-push:
    uses: ./.github/workflows/docker-push.yml
    needs: [code-quality, secret-scanning, dependency-scan, docker-scan, sonar-scan, code-test]
    secrets: inherit

#-----------------------CD-----------------------------------------------

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: docker-push
    secrets: inherit
