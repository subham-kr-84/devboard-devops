#goals- i have to ensure that my Docker images are secure and free from vulnerabilities.
name: Docker Scan
on:
  workflow_call:

jobs:
  docker-file-lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ['backend', 'frontend']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folder }}/Dockerfile

# Check Docker credentials before proceeding with the build and scan steps

      - name: Check Docker credentials configuration
        run: |
         echo "Docker username configured: ${{ vars.DOCKERHUB_USERNAME != '' }}"
         echo "Docker password configured: ${{ secrets.DOCKERHUB_PASSWORD != '' }}"    

      - name: docker setup (login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: docker build ${{ matrix.folder }}
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest .
        working-directory: ${{ matrix.folder }}

      - name: run trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vulnerability-type: 'os,library'
          severity: 'HIGH,CRITICAL'